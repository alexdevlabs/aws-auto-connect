<!-- AWS AutoConnect app icon, "Tunnel". Master artwork on the macOS 1024 grid (824 body, 100 margin). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0A1423" flood-opacity="0.30"/>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#F2A93B" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <!-- Glyph: the 0..100 tunnel mark, scaled to 595 px and centred. -->
  <g transform="translate(214.5 214.5) scale(5.95)" fill="none" stroke="#13233A" stroke-width="7" stroke-linecap="round">
    <path d="M18 82 V52 A32 32 0 0 1 82 52 V82"/>
    <path d="M31 82 V54 A19 19 0 0 1 69 54 V82" opacity="0.6"/>
    <path d="M44 82 V57 A6 6 0 0 1 56 57 V82" opacity="0.3"/>
    <path d="M12 82 H88"/>
  </g>
</svg>
